<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Nexo — proposta local de composição</title><style>*{box-sizing:border-box}body{font:15px/1.6 system-ui;background:#f6f8fc;color:#0f172a;margin:0}aside{position:fixed;width:232px;height:100vh;background:#0b1931;color:white;padding:24px}aside strong{font-size:24px}aside p{color:#c1d0e8}main{margin-left:232px;max-width:1280px;padding:32px}h1{font-size:30px;margin:0}h2{font-size:18px}header{display:flex;justify-content:space-between;align-items:center;margin:24px 0}button{font:inherit;background:#1d4ed8;color:white;border:0;border-radius:10px;padding:12px 16px}.secondary{background:white;border:1px solid #64748b;color:#0f172a}section{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:24px;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.grid section{margin:0}.balance{background:#eff6ff}b.money{display:block;font-size:32px;font-variant-numeric:tabular-nums}article{border-bottom:1px solid #e2e8f0;padding:16px 0;display:flex;justify-content:space-between}small{color:#475569}details{margin:16px 0}textarea{width:100%;border:1px solid #64748b;border-radius:10px;padding:16px}nav a{display:block;color:inherit;padding:10px}body>small{position:fixed;bottom:0;right:0;background:white;padding:8px}@media(max-width:1023px){aside{display:none}main{margin:0;padding:16px}.grid{grid-template-columns:1fr}}</style><aside><strong>Nexo</strong><p>Espaço de apresentação</p><nav><a>Visão geral</a><a>Lançamentos</a><a>Análises</a><details><summary>Operação</summary>Vendas · Despesas · Produtos · Clientes</details><details><summary>Gestão</summary>Organização · Equipe · Documentos</details><a>Assistente IA</a></nav></aside><main id="app"></main><small>Proposta de composição · dados sintéticos · sem API ou gravação</small><script>const type=new URLSearchParams(location.search).get('tela')||'dashboard';const rows='<article><div>Consultoria<br><small>13/10 · Lançamento manual</small></div><b>+ R$ 4.800,00</b></article><article><div>Materiais<br><small>13/10 · Lançamento manual</small></div><b>− R$ 350,00</b></article>';const title={dashboard:'Visão geral',lancamentos:'Lançamentos',ia:'Assistente financeiro',planos:'Planos',organizacao:'Organização'}[type];let c='';if(type==='dashboard')c='<small>Este mês · 01/10 a 13/10</small><div class="grid"><section class="balance">Saldo do período<b class="money">R$ 4.770,00</b></section><section>Entradas<b class="money">R$ 6.000,00</b></section><section>Saídas<b class="money">R$ 1.230,00</b></section></div><section><h2>Últimas movimentações</h2>'+rows+'</section><section><h2>Categorias de gastos</h2>Moradia · Materiais · Transporte</section>';if(type==='lancamentos')c='<details><summary>Período · Este mês</summary>De / Até / Aplicar</details><section>'+rows+'</section>';if(type==='ia')c='<section><h2>Sua pergunta</h2><textarea placeholder="O que você quer entender?" rows="4"></textarea><p><input type="checkbox"> Autorizar o envio do resumo deste mês, sem dados de clientes.</p><button>Perguntar ao assistente</button><details><summary>Sugestões de perguntas</summary>Margem · Reserva · Fluxo de caixa</details></section>';if(type==='planos')c='<p>Plano atual: Business · alterações simuladas em desenvolvimento</p><div class="grid">'+['Free','Pro','Business'].map((p,i)=>'<section><h2>'+p+'</h2><b class="money">R$ '+[0,39,99][i]+',00</b><small>/mês · '+(i===2?'até 10 pessoas':'1 pessoa')+'</small><p>'+['O essencial','Planejamento individual','Colaboração'][i]+'</p><button class="secondary">'+(i===2?'Plano atual':'Fazer downgrade')+'</button></section>').join('')+'</div><details><summary>Comparar todos os recursos</summary>Recursos e limites completos</details>';if(type==='organizacao')c='<section><h2>Espaço de apresentação</h2><p>Seu papel: Proprietário · Business · 1 de 10 pessoas</p><h2>Seus espaços</h2><button class="secondary">Espaço atual</button><details><summary>Configurações do espaço</summary>Novo nome / Salv
