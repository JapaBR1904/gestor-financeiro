spring.application.name=nexo-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexo}
spring.datasource.username=${DB_USERNAME:nexo_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

nexo.mail.enabled=${MAIL_ENABLED:false}
nexo.mail.from=${MAIL_FROM:no-reply@nexo.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
