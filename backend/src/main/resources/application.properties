spring.application.name=nexo-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexo}
spring.datasource.username=${DB_USERNAME:nexo_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080
