spring.application.name=nexo-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexo}
spring.datasource.username=${DB_USERNAME:nexo_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

nexo.allowed-origins=${NEXO_ALLOWED_ORIGINS:http://localhost:3000}
nexo.frontend-url=${NEXO_FRONTEND_URL:http://localhost:3000}
nexo.cookie.secure=${COOKIE_SECURE:false}
nexo.saas.prototype-plan-switch=${SAAS_PROTOTYPE_PLAN_SWITCH:true}

# Resend é o transporte padrão; habilitação e credenciais são sempre explícitas.
nexo.email.provider=${NEXO_EMAIL_PROVIDER:resend}
nexo.resend.enabled=${RESEND_ENABLED:false}
nexo.resend.api-key=${RESEND_API_KEY:}
nexo.resend.from=${RESEND_FROM:}
nexo.resend.reply-to=${RESEND_REPLY_TO:}

# Compatibilidade SMTP temporária: somente NEXO_EMAIL_PROVIDER=smtp utiliza estas opções.
nexo.mail.enabled=${MAIL_ENABLED:false}
nexo.mail.from=${MAIL_FROM:no-reply@nexo.local}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}

# Limites de I/O: um SMTP sem resposta não deve reter indefinidamente a fila de recuperação.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Somente dev/test; perfis prod/production impedem a criação do simulador.
nexo.pagamento.simulado.enabled=${PAGAMENTO_SIMULADO_ENABLED:false}

# Opcional: ausência de chave/modelo válido deixa a IA indisponível, sem impedir startup.
nexo.ia.api-key=${GEMINI_API_KEY:}
nexo.ia.modelo=${GEMINI_MODEL:gemini-flash-latest}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Verificação obrigatória por padrão; a dispensa é restrita a ambientes fora de produção.
nexo.auth.email-verification-enabled=${NEXO_EMAIL_VERIFICATION_ENABLED:true}

# Aprovação manual explícita, separada de email verificado. Desativada por padrão.
nexo.auth.manual-approval-enabled=${NEXO_MANUAL_APPROVAL_ENABLED:false}
nexo.admin.cadastros.usuario=${NEXO_ADMIN_CADASTROS_USUARIO:}
nexo.admin.cadastros.senha=${NEXO_ADMIN_CADASTROS_SENHA:}
