# Somente configuração de hospedagem; não cria ou altera tabelas.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
nexo.allowed-origins=${NEXO_ALLOWED_ORIGINS}
nexo.frontend-url=${NEXO_FRONTEND_URL}
nexo.cookie.secure=${COOKIE_SECURE:true}
nexo.saas.prototype-plan-switch=false
nexo.pagamento.simulado.enabled=false
nexo.email.provider=${NEXO_EMAIL_PROVIDER:disabled}
nexo.auth.manual-approval-enabled=${NEXO_MANUAL_APPROVAL_ENABLED}
